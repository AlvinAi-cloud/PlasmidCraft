name: Linux AppImage

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: linux-appimage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appimage:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install Linux build and launch dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config curl wget file libwebkit2gtk-4.1-dev libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            libfuse2 xvfb xauth dbus-x11 x11-utils xdg-utils
      - name: Install Rust target
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add x86_64-unknown-linux-gnu
          rustup component add rustfmt
      - name: Install JavaScript build tools
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Source and native checks
        run: |
          pnpm check
          pnpm test
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - name: Build AppImage
        run: pnpm desktop:build --ci --target x86_64-unknown-linux-gnu --bundles appimage
      - name: Verify and stage AppImage
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          images=(src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage)
          test "${#images[@]}" -eq 1
          test -f "${images[0]}"
          mkdir -p test-results/linux-appimage
          image="$PWD/test-results/linux-appimage/PlasmidCraft-${version}-Linux-x86_64.AppImage"
          cp "${images[0]}" "$image"
          chmod +x "$image"
          file "$image" | tee test-results/linux-appimage/package-checks.txt
          file "$image" | grep -q 'ELF 64-bit.*x86-64'
          extract=$(mktemp -d)
          (cd "$extract" && "$image" --appimage-extract > /dev/null)
          test -x "$extract/squashfs-root/AppRun"
          binary="$extract/squashfs-root/usr/bin/plasmidcraft-desktop"
          test -x "$binary"
          file "$binary" | tee -a test-results/linux-appimage/package-checks.txt
          file "$binary" | grep -q 'ELF 64-bit.*x86-64'
          for notice in LICENSE THIRD_PARTY_NOTICES.txt; do
            matched=false
            while IFS= read -r -d '' candidate; do
              if cmp -s "$notice" "$candidate"; then matched=true; break; fi
            done < <(find "$extract/squashfs-root" -type f -name "$notice" -print0)
            test "$matched" = true
          done
          rm -rf "$extract"
          (cd test-results/linux-appimage && sha256sum ./*.AppImage > SHA256SUMS.txt)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "PLASMIDCRAFT_APPIMAGE=$image" >> "$GITHUB_ENV"
      - name: Check native AppImage startup
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          GDK_BACKEND: x11
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          export XDG_CONFIG_HOME="$RUNNER_TEMP/plasmidcraft-appimage-profile/config"
          export XDG_DATA_HOME="$RUNNER_TEMP/plasmidcraft-appimage-profile/data"
          export XDG_CACHE_HOME="$RUNNER_TEMP/plasmidcraft-appimage-profile/cache"
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_CACHE_HOME"
          xvfb-run -a -s '-screen 0 1440x1000x24' dbus-run-session -- bash -euo pipefail <<'CHECK'
          "$PLASMIDCRAFT_APPIMAGE" > test-results/linux-appimage/startup.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true; wait "$app_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat test-results/linux-appimage/startup.log
              exit 1
            fi
            xwininfo -root -tree > test-results/linux-appimage/window-tree.txt
            window_id=$(awk '/pET-21b\(\+\).*PlasmidCraft/ {print $1; exit}' test-results/linux-appimage/window-tree.txt)
            if [ -n "$window_id" ] && xwininfo -id "$window_id" | grep -q 'Map State: IsViewable'; then
              sleep 3
              kill -0 "$app_pid"
              echo 'Native AppImage opened a visible window and loaded the supplied pET-21b(+) document.'
              exit 0
            fi
            sleep 1
          done
          cat test-results/linux-appimage/startup.log
          exit 1
          CHECK
      - name: Upload AppImage and checksum
        uses: actions/upload-artifact@v7
        with:
          name: PlasmidCraft-${{ steps.package.outputs.version }}-Linux-x86_64
          path: |
            test-results/linux-appimage/*.AppImage
            test-results/linux-appimage/SHA256SUMS.txt
          if-no-files-found: error
      - name: Upload Linux verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Linux-AppImage-evidence
          path: |
            test-results/linux-appimage/*.log
            test-results/linux-appimage/*.txt
          if-no-files-found: ignore
      - name: Download instructions
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          The Linux AppImage and SHA-256 checksum are in this run's **Artifacts** section.
          Download the Linux-x86_64 artifact and extract the ZIP. On Linux, make
          the `.AppImage` file executable in its Properties, then open it.
          This build does not publish a release or change the Mac/Windows packages.
          SUMMARY
