name: Desktop builds
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  renderer:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check && pnpm test
      - run: pnpm exec playwright install chromium webkit
      - run: pnpm test:ui
        env:
          PLASMIDCRAFT_SCREENSHOTS: test-results/chromium
          PLASMIDCRAFT_TEST_OUTPUT: test-results/chromium
      - run: pnpm test:ui
        env:
          PLASMIDCRAFT_BROWSER: webkit
          PLASMIDCRAFT_SCREENSHOTS: test-results/webkit
          PLASMIDCRAFT_TEST_OUTPUT: test-results/webkit
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Renderer-evidence
          path: test-results/
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install Rust target
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add ${{ matrix.target }}
          rustup component add rustfmt
      - name: Install JavaScript build tools
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Source and native checks
        run: |
          pnpm check
          pnpm test
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - name: Build desktop package
        run: pnpm desktop:build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v7
        with:
          name: PlasmidCraft-0.3-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
