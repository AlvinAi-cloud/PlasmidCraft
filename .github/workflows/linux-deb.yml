name: Linux Debian package

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - .github/workflows/desktop.yml
      - .github/scripts/package-macos-dmg.sh
      - SOURCE_MANIFEST.json
  pull_request:
    paths-ignore:
      - .github/workflows/desktop.yml
      - .github/scripts/package-macos-dmg.sh
      - SOURCE_MANIFEST.json

permissions:
  contents: read

concurrency:
  group: linux-deb-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deb:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install Linux build and launch dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config curl wget file libwebkit2gtk-4.1-dev libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            xvfb xauth dbus-x11 x11-utils xdg-utils
      - name: Install Rust target
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add x86_64-unknown-linux-gnu
          rustup component add rustfmt
      - name: Install JavaScript build tools
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Source and native checks
        run: |
          pnpm check
          pnpm test
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - name: Build Debian package
        run: pnpm desktop:build --ci --target x86_64-unknown-linux-gnu --bundles deb
      - name: Verify and stage Debian package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p 'require("./package.json").version')
          packages=(src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb)
          test "${#packages[@]}" -eq 1
          mkdir -p test-results/linux-deb
          package="$PWD/test-results/linux-deb/PlasmidCraft-${version}-Linux-amd64.deb"
          cp "${packages[0]}" "$package"
          test "$(dpkg-deb -f "$package" Version)" = "$version"
          test "$(dpkg-deb -f "$package" Architecture)" = amd64
          dpkg-deb --info "$package" | tee test-results/linux-deb/package-checks.txt
          sudo apt-get install -y "$package"
          binary=$(command -v plasmidcraft-desktop)
          test -x "$binary"
          file "$binary" | grep -q 'ELF 64-bit.*x86-64'
          (cd test-results/linux-deb && sha256sum ./*.deb > SHA256SUMS.txt)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "PLASMIDCRAFT_BINARY=$binary" >> "$GITHUB_ENV"
      - name: Check native Debian package startup
        shell: bash
        env:
          GDK_BACKEND: x11
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          export XDG_CONFIG_HOME="$RUNNER_TEMP/plasmidcraft-deb-profile/config"
          export XDG_DATA_HOME="$RUNNER_TEMP/plasmidcraft-deb-profile/data"
          export XDG_CACHE_HOME="$RUNNER_TEMP/plasmidcraft-deb-profile/cache"
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_CACHE_HOME"
          xvfb-run -a -s '-screen 0 1440x1000x24' dbus-run-session -- bash -euo pipefail <<'CHECK'
          "$PLASMIDCRAFT_BINARY" > test-results/linux-deb/startup.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true; wait "$app_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat test-results/linux-deb/startup.log
              exit 1
            fi
            xwininfo -root -tree > test-results/linux-deb/window-tree.txt
            window_id=$(awk '/pET-21b\(\+\).*PlasmidCraft/ {print $1; exit}' test-results/linux-deb/window-tree.txt)
            if [ -n "$window_id" ] && xwininfo -id "$window_id" | grep -q 'Map State: IsViewable'; then
              sleep 3
              kill -0 "$app_pid"
              echo 'Native Debian package opened a visible window and loaded the supplied pET-21b(+) document.'
              exit 0
            fi
            sleep 1
          done
          cat test-results/linux-deb/startup.log
          exit 1
          CHECK
      - name: Upload Debian package and checksum
        uses: actions/upload-artifact@v7
        with:
          name: PlasmidCraft-${{ steps.package.outputs.version }}-Linux-x86_64
          path: |
            test-results/linux-deb/*.deb
            test-results/linux-deb/SHA256SUMS.txt
          if-no-files-found: error
      - name: Upload Linux verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Linux-Debian-evidence
          path: |
            test-results/linux-deb/*.log
            test-results/linux-deb/*.txt
          if-no-files-found: ignore
