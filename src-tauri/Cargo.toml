[package]
name = "plasmidcraft-desktop"
version = "0.4.0"
description = "PlasmidCraft desktop sequence workspace"
authors = ["PlasmidCraft contributors"]
edition = "2021"
rust-version = "1.90"
license = "MIT"

[lib]
name = "plasmidcraft_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "macros", "net", "io-util", "time"] }
base64 = "0.22"
sha2 = "0.10"
getrandom = "0.3"
subtle = "2"
fs2 = "0.4"
tempfile = "3"
jsonwebtoken = { version = "10", default-features = false, features = ["aws_lc_rs", "use_pem"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
